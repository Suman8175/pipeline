# .github/workflows/version-preview.yml
name: Version Preview

on:
  workflow_call:
    inputs:
      tag-prefix:
        required: false
        type: string
        default: 'v'
        description: 'Prefix for version tags, e.g. "v" → v1.2.3'

      default-bump:
        required: false
        type: string
        default: 'patch'
        description: 'Fallback bump type if no conventional commit prefix found (major | minor | patch)'

    outputs:
      current-tag:
        description: 'The latest existing tag (baseline), e.g. v1.2.3'
        value: ${{ jobs.preview.outputs.current-tag }}

      next-version:
        description: 'The calculated next semver string, e.g. 1.3.0'
        value: ${{ jobs.preview.outputs.next-version }}

      next-tag:
        description: 'The next tag including prefix, e.g. v1.3.0'
        value: ${{ jobs.preview.outputs.next-tag }}

      bump-type:
        description: 'Which part would be bumped: major | minor | patch'
        value: ${{ jobs.preview.outputs.bump-type }}

      commit-count:
        description: 'Number of commits since the last tag'
        value: ${{ jobs.preview.outputs.commit-count }}

jobs:
  preview:
    name: Preview Next Version
    runs-on: ubuntu-latest

    outputs:
      current-tag:   ${{ steps.calc.outputs.current-tag }}
      next-version:  ${{ steps.calc.outputs.next-version }}
      next-tag:      ${{ steps.calc.outputs.next-tag }}
      bump-type:     ${{ steps.calc.outputs.bump-type }}
      commit-count:  ${{ steps.calc.outputs.commit-count }}

    steps:
      - name: Checkout (full history required)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version (read-only)
        id: calc
        shell: bash
        run: |
          set -euo pipefail

          PREFIX="${{ inputs.tag-prefix }}"
          DEFAULT_BUMP="${{ inputs.default-bump }}"

          # ── 1. Find latest reachable tag ──────────────────────────────────
          LATEST_TAG=$(git describe \
            --tags \
            --match "${PREFIX}[0-9]*" \
            --abbrev=0 \
            HEAD 2>/dev/null || true)

          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tags found — treating as fresh repo (${PREFIX}0.0.0)"
            LATEST_TAG="${PREFIX}0.0.0"
            COMMIT_RANGE="HEAD"
            IS_FRESH="true"
          else
            COMMIT_RANGE="${LATEST_TAG}..HEAD"
            IS_FRESH="false"
          fi

          # ── 2. Parse current version ──────────────────────────────────────
          CURRENT_VERSION="${LATEST_TAG#"$PREFIX"}"
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          # ── 3. Collect commits since last tag ─────────────────────────────
          # Full log: subject + body, separated by a record delimiter
          RAW_LOG=$(git log "$COMMIT_RANGE" --pretty=format:"---COMMIT---%n%H%n%s%n%b" 2>/dev/null || true)
          COMMIT_COUNT=$(git rev-list --count "$COMMIT_RANGE" 2>/dev/null || echo 0)

          echo "Current tag   : $LATEST_TAG"
          echo "Commit range  : $COMMIT_RANGE"
          echo "Commits found : $COMMIT_COUNT"

          # ── 4. Determine bump type from conventional commits ──────────────
          BUMP="$DEFAULT_BUMP"

          while IFS= read -r line; do
            if echo "$line" | grep -qiE '(BREAKING[[:space:]]CHANGE|^[a-z]+(\([^)]*\))?!:)'; then
              BUMP="major"
              break
            fi
            if [ "$BUMP" != "major" ] && echo "$line" | grep -qE '^feat(\([^)]*\))?:'; then
              BUMP="minor"
            fi
          done < <(git log "$COMMIT_RANGE" --pretty=format:"%s%n%b" 2>/dev/null || true)

          # ── 5. No unreleased commits — nothing would be bumped ────────────
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "⚠️  No commits since $LATEST_TAG — version would not change."
            BUMP="none"
            NEW_VERSION="$CURRENT_VERSION"
            NEW_TAG="$LATEST_TAG"
          else
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0          ;;
              patch) PATCH=$((PATCH + 1))                   ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            NEW_TAG="${PREFIX}${NEW_VERSION}"
          fi

          # ── 6. Write outputs ──────────────────────────────────────────────
          echo "current-tag=${LATEST_TAG}"    >> "$GITHUB_OUTPUT"
          echo "next-version=${NEW_VERSION}"  >> "$GITHUB_OUTPUT"
          echo "next-tag=${NEW_TAG}"          >> "$GITHUB_OUTPUT"
          echo "bump-type=${BUMP}"            >> "$GITHUB_OUTPUT"
          echo "commit-count=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Build Commit Table
        id: commits
        shell: bash
        run: |
          PREFIX="${{ inputs.tag-prefix }}"
          LATEST_TAG=$(git describe \
            --tags \
            --match "${PREFIX}[0-9]*" \
            --abbrev=0 \
            HEAD 2>/dev/null || true)

          [ -z "$LATEST_TAG" ] && COMMIT_RANGE="HEAD" || COMMIT_RANGE="${LATEST_TAG}..HEAD"

          # Write commit table rows to a temp file for the summary step
          git log "$COMMIT_RANGE" \
            --pretty=format:"| \`%h\` | %s | %an | %cd |" \
            --date=format:'%Y-%m-%d' \
            > /tmp/commit_rows.txt || true

      - name: Write Job Summary
        shell: bash
        run: |
          CURRENT="${{ steps.calc.outputs.current-tag }}"
          NEXT="${{ steps.calc.outputs.next-tag }}"
          BUMP="${{ steps.calc.outputs.bump-type }}"
          COUNT="${{ steps.calc.outputs.commit-count }}"

          {
            echo "### 🔍 Version Preview (read-only — no tag created)"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Current tag  | \`${CURRENT}\` |"
            echo "| Next tag     | \`${NEXT}\`    |"
            echo "| Bump type    | \`${BUMP}\`    |"
            echo "| Commits since last tag | **${COUNT}** |"
            echo ""

            if [ "$COUNT" -eq 0 ]; then
              echo "> ⚠️ No unreleased commits — a release right now would not advance the version."
            else
              echo "#### 📋 Commits included in next release"
              echo ""
              echo "| Hash | Message | Author | Date |"
              echo "|------|---------|--------|------|"
              cat /tmp/commit_rows.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"